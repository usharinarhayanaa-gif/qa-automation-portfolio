name: Cross-Framework CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  playwright-tests:
    name: Playwright TypeScript Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playwright-typescript-framework
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: playwright-typescript-framework/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Tests
        run: npx playwright test

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-typescript-framework/playwright-report/
          retention-days: 7

  selenium-tests:
    name: Selenium Java TestNG Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: selenium-java-framework
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Maven Tests (Headless)
        run: mvn clean test -Dheadless=true

      - name: Upload ExtentReport HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report
          path: selenium-java-framework/test-output/ExtentReport.html
          retention-days: 7